<!-- begin project info -->
<div class="container-fluid project-intro">

    <div class="row project-intro-paragraph pb-4 pb-md-6 pt-0">

        <!-- description -->
        <div class="col-md-8 col-lg-7 pb-3">

            {% for paragraph in page.description %}
                <p>{{ paragraph }}</p>
            {% endfor %}

        </div>

        <!-- credits -->
        <div class="offset-lg-3 col-lg-5 offset-md-2 col-md-6 fs-5 pb-3" id="credits">

            {% if page.credits_title %}
                <p><span class="bodyul">{{ page.credits_title }}</span></p>
            {% endif %}

            <ul id="roles">

                {% for item in page.credits %}

                <li class="collaborator fs-5">

                    <span class="role">{{ item.role }}</span><br />

                    {{ item.name }}

                </li>

                {% endfor %}

            </ul>

        </div>

    </div>

</div>
<!-- end project info -->
