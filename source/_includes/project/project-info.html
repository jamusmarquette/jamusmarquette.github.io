<!-- begin project info -->
<div class="container-fluid project-intro">

    <h1 class="project-page-title">{{ page.title }}</h1>

    <div class="row project-intro-paragraph pb-4 pb-md-6 pt-0">

        <!-- description -->
        <div class="{{ page.description_col | default: 'col-md-8 col-lg-7 pb-3' }}">

            {% for paragraph in page.description %}
                <p>{{ paragraph }}</p>
            {% endfor %}

        </div>

        {% if page.project_facts %}
        <div class="col-md-8 col-lg-7 pb-3">
            <dl class="project-facts">
                {% for fact in page.project_facts %}
                <div class="project-facts__item">
                    <dt>{{ fact.label }}</dt>
                    <dd>{{ fact.value }}</dd>
                </div>
                {% endfor %}
            </dl>
        </div>
        {% endif %}

        {% unless include.hide_credits %}
          {% include project/credits.html %}
        {% endunless %}

    </div>

</div>
<!-- end project info -->
